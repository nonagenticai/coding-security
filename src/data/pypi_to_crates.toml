# PyPI package -> Rust crate(s) that replace it in a py2rust port.
#
# Read by services/rust_crate_map.py and served as `rust_crate_map` on
# POST /api/security/sbom/{container_name}/dependencies. Facts only: the plan
# agent still chooses, and a package absent from this file is reported as
# `unmapped`, never guessed.
#
# Rules (enforced by tests/unit/test_rust_crate_map.py against this file):
# * key = PEP 503-normalised PyPI name (lowercase, runs of -_. -> "-")
# * crates = crates.io names exactly as published (serde_json, not serde-json)
# * crates = Cargo.toml [dependencies] / [dev-dependencies] entries only
# * tools = optional; binaries installed with `cargo install`, never a dependency
# * crates = [] and no tools = nothing to add (std / language / toolchain); `note` says which
# * bump map_version on every change
map_version = "2026-11-04.2"

# ── web / HTTP server ───────────────────────────────────────────────────────
[packages.fastapi]
crates = ["axum"]
note = "OpenAPI generation: utoipa"

[packages.starlette]
crates = ["axum", "tower-http"]
note = "middleware (CORS, compression, tracing) from tower-http"

[packages.flask]
crates = ["axum"]

[packages.uvicorn]
crates = ["tokio", "axum"]
note = "axum::serve on a tokio runtime"

[packages.gunicorn]
crates = ["tokio", "axum"]
note = "no prefork worker model: one multi-threaded tokio runtime"

[packages.python-multipart]
crates = ["axum"]
note = "axum `multipart` feature (axum::extract::Multipart)"

[packages.websockets]
crates = ["tokio-tungstenite"]

# ── HTTP clients ────────────────────────────────────────────────────────────
[packages.httpx]
crates = ["reqwest"]
note = "in-process app tests: tower::ServiceExt::oneshot on the axum Router"

[packages.requests]
crates = ["reqwest"]
note = "`blocking` feature for sync callers"

[packages.aiohttp]
crates = ["reqwest"]
note = "client side; an aiohttp server maps to axum"

