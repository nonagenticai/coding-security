# Vendored semgrep rules for DETERMINISTIC, OFFLINE unit tests of SemgrepScanner.
# Production uses `--config auto` (the community registry); these few rules exist
# only so the scanner's parse/map/dedup logic can be asserted without network.
rules:
  - id: test-python-sql-string-concat
    languages: [python]
    severity: ERROR
    message: Possible SQL injection via string building in a SQL execute call.
    metadata:
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp:
        - "A03:2021 - Injection"
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: $CUR.execute("..." + $X)
          - pattern: $CUR.execute($X + "...")
          - pattern: $CUR.execute("..." % $X)
          - pattern: $CUR.execute("...".format(...))

  - id: test-js-sql-string-concat
    languages: [javascript, typescript]
    severity: ERROR
    message: Possible SQL injection via string concatenation in a query call.
    metadata:
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp:
        - "A03:2021 - Injection"
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: $DB.query("..." + $X)
          - pattern: $DB.query($X + "...")

  - id: test-python-weak-md5
    languages: [python]
    severity: WARNING
    message: Weak cryptographic hash algorithm (MD5).
    metadata:
      cwe:
        - "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      confidence: MEDIUM
    pattern: hashlib.md5(...)
